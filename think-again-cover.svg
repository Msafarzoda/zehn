<svg viewBox="0 0 300 420" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="thinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3d4d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1f28;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Main book shape -->
  <rect width="300" height="420" fill="url(#thinkGrad)" rx="8"/>

  <!-- Decorative elements - arrows/thinking symbols -->
  <g transform="translate(70, 90)" opacity="0.7">
    <path d="M 0 0 L 20 0 L 15 -8 M 20 0 L 15 8" stroke="#82FF7F" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(210, 320)" opacity="0.5">
    <path d="M 0 0 L -20 0 L -15 -8 M -20 0 L -15 8" stroke="#82FF7F" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Light bulb / idea icon -->
  <g transform="translate(150, 110)">
    <!-- Bulb -->
    <circle cx="0" cy="-5" r="16" fill="none" stroke="#82FF7F" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -12 10 Q -12 15 -8 15 L 8 15 Q 12 15 12 10"
          fill="none" stroke="#82FF7F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Filament -->
    <path d="M -5 5 Q 0 0 5 5" fill="none" stroke="#82FF7F" stroke-width="1.5" opacity="0.8"/>
    <!-- Glow effect -->
    <circle cx="0" cy="-5" r="20" fill="none" stroke="#82FF7F" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Circular thinking pattern -->
  <circle cx="50" cy="250" r="28" fill="none" stroke="#82FF7F" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>
  <circle cx="250" cy="180" r="32" fill="none" stroke="#82FF7F" stroke-width="2" opacity="0.3" stroke-dasharray="5,5"/>

  <!-- Title -->
  <text x="150" y="200" font-family="Arial, sans-serif" font-size="44" font-weight="bold"
        fill="#82FF7F" text-anchor="middle" letter-spacing="1">THINK AGAIN</text>

  <!-- Subtitle -->
  <text x="150" y="250" font-family="Arial, sans-serif" font-size="16"
        fill="#82FF7F" opacity="0.8" text-anchor="middle">Reconsider & Evolve</text>

  <!-- Author name -->
  <text x="150" y="380" font-family="Georgia, serif" font-size="14"
        fill="#82FF7F" opacity="0.6" text-anchor="middle" font-style="italic">Adam Grant</text>

  <!-- Top accent line -->
  <line x1="30" y1="40" x2="270" y2="40" stroke="#82FF7F" stroke-width="2" opacity="0.6"/>
</svg>
