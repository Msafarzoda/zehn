<svg viewBox="0 0 300 420" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="mindsetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a4d3e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d2818;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Main book shape -->
  <rect width="300" height="420" fill="url(#mindsetGrad)" rx="8"/>

  <!-- Decorative circles pattern -->
  <circle cx="50" cy="80" r="35" fill="none" stroke="#82FF7F" stroke-width="2" opacity="0.6"/>
  <circle cx="50" cy="80" r="25" fill="none" stroke="#82FF7F" stroke-width="1.5" opacity="0.4"/>

  <circle cx="250" cy="320" r="40" fill="none" stroke="#82FF7F" stroke-width="2" opacity="0.5"/>
  <circle cx="250" cy="320" r="28" fill="none" stroke="#82FF7F" stroke-width="1" opacity="0.3"/>

  <!-- Brain/mind icon -->
  <g transform="translate(150, 100)">
    <path d="M -25 0 Q -30 -15 -20 -25 Q -10 -30 0 -28 Q 10 -30 20 -25 Q 30 -15 25 0"
          fill="none" stroke="#82FF7F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-15" cy="5" r="3" fill="#82FF7F"/>
    <circle cx="0" cy="8" r="3" fill="#82FF7F"/>
    <circle cx="15" cy="5" r="3" fill="#82FF7F"/>
    <path d="M -10 15 L -10 30 M 0 15 L 0 32 M 10 15 L 10 30"
          stroke="#82FF7F" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <text x="150" y="200" font-family="Arial, sans-serif" font-size="48" font-weight="bold"
        fill="#82FF7F" text-anchor="middle" letter-spacing="2">MINDSET</text>

  <!-- Subtitle -->
  <text x="150" y="250" font-family="Arial, sans-serif" font-size="16"
        fill="#82FF7F" opacity="0.8" text-anchor="middle">Growth Begins Here</text>

  <!-- Author name -->
  <text x="150" y="380" font-family="Georgia, serif" font-size="14"
        fill="#82FF7F" opacity="0.6" text-anchor="middle" font-style="italic">Carol S. Dweck</text>

  <!-- Bottom accent line -->
  <line x1="30" y1="400" x2="270" y2="400" stroke="#82FF7F" stroke-width="2" opacity="0.6"/>
</svg>
