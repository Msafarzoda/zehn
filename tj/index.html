         :root {
            --ink: #03212E;

        .lora {

        /* nav */
        
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            padding: 16px 0;

            border-bottom: 1px solid transparent
        }
        
        .nav.scrolled {
            background: rgba(3, 33, 46, .82);
            backdrop-filter: blur(20px) saturate(140%);

        }
        
        .logo {

            font-weight: 800;

        }

            display: flex;
            gap: 28px;
            font-size: 14px;

        }
        
        .nav-links a:hover {
            color: var(--text)
        }
        
        .nav-cta {
            display: flex;
            gap: 10px;
            align-items: center
        }
        
        @media(max-width:860px) {
            .nav-links {
                display: none
            }
        }
        /* buttons */
        
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 13px 20px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 14px;
            transition: transform .15s ease, background .15s, box-shadow .15s, border-color .15s;
            border: 1px solid transparent;
            white-space: nowrap
        }
        
        .btn:active {
            transform: translateY(1px)
        }
        
        .btn-primary {
            background: var(--green);
            color: var(--ink);
            box-shadow: 0 10px 34px rgba(130, 255, 127, .22)
        }
        
        .btn-primary:hover {
            background: #9effa1;
            box-shadow: 0 14px 40px rgba(130, 255, 127, .32)
        }
        
        .btn-ghost {
            border-color: var(--line-2);
            color: var(--text)
        }
        
        .btn-ghost:hover {
            border-color: rgba(255, 255, 255, .3);
            background: rgba(255, 255, 255, .04)
        }
        
        .btn-dark {
            background: #0a0a0a;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, .1)
        }
        
        .btn-dark:hover {
            background: #111;
            border-color: rgba(255, 255, 255, .2)
        }
        
        .card {
            background: linear-gradient(180deg, rgba(255, 255, 255, .03), rgba(255, 255, 255, .01));

            padding: 28px;
            position: relative;
            overflow: hidden
        }

            position: absolute;
            inset: 0;

            opacity: .4;
            pointer-events: none
        }

            align-items: center;

            color: var(--green);
            border: 1px solid rgba(130, 255, 127, .22)
        }

            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 8px var(--green)
        }

        .section-head {
            max-width: 720px;
            margin: 0 auto 72px;
            text-align: center
        }
        
        .section-head h2 {
            font-size: clamp(32px, 5vw, 56px);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.05;
            margin-top: 16px;
            text-wrap: balance
        }
        
        .section-head h2 em {
            font-family: 'Lora', serif;
            font-weight: 400;
            font-style: italic;
            color: var(--green)
        }
        
        .section-head p {
            margin-top: 20px;
            color: var(--text-dim);
            font-size: 18px;
            line-height: 1.55;
            text-wrap: pretty
        }
        /* smooth scroll */
        
        html {
            scroll-behavior: smooth
        }
        /* global cursor */
        
        a[href],
        button,
        [role="button"],
        [tabindex] {
            cursor: pointer
        }
        /* focus rings — WCAG 2.1 AA */
        
        :focus-visible {
            outline: 2px solid var(--green);
            outline-offset: 3px;
            border-radius: 4px
        }
        
        button:focus-visible,
        a:focus-visible {
            outline: 2px solid var(--green);
            outline-offset: 3px
        }
        
        input:focus-visible {
            outline: 2px solid var(--green);
            outline-offset: 2px
        }
        /* skip-to-content — CSS-only (no JS style manipulation) */
        
        .skip-link {
            position: absolute;
            left: -9999px;
            top: -9999px;
            z-index: 9999;
            padding: 8px 16px;
            background: var(--green);
            color: var(--ink);
            font-weight: 700;
            font-size: 14px;
            border-radius: 8px;
            text-decoration: none;
            white-space: nowrap
        }
        
        .skip-link:focus {
            left: 16px;
            top: 16px
        }
        /* scarcity bar */
        
        .scarcity-bar {
            background: linear-gradient(90deg, rgba(130, 255, 127, .12), rgba(251, 242, 168, .08));
            border: 1px solid rgba(130, 255, 127, .25);
            border-radius: 12px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 24px
        }
        
        .scarcity-progress {
            flex: 1;
            min-width: 180px;
            height: 6px;
            background: rgba(255, 255, 255, .08);
            border-radius: 999px;
            overflow: hidden
        }
        
        .scarcity-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--green), var(--cream));
            border-radius: 999px
        }
        /* scroll marquee */
        
        @keyframes marquee {
            0% {
                transform: translateX(0)
            }
            100% {
                transform: translateX(-50%)
            }
        }
        
        .marquee-track {
            display: flex;
            gap: 48px;
            animation: marquee 28s linear infinite;
            width: max-content
        }
        
        .marquee-wrap {
            overflow: hidden;
            -webkit-mask: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent)
        }
        
        @media(prefers-reduced-motion:reduce) {
            .marquee-track {
                animation: none
            }
        }
        /* step connector */
        
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1)
            }
            50% {
                opacity: .6;
                transform: scale(.85)
            }
        }
        
        @media(prefers-reduced-motion:reduce) {
            * {
                animation-duration: .01ms!important;
                transition-duration: .01ms!important
            }
        }
        /* category card hover */
        
        .cat-card {
            transition: transform .2s ease, border-color .2s ease, background .2s ease
        }
        
        .cat-card:hover {
            transform: translateY(-3px);
            border-color: rgba(130, 255, 127, .3);
            background: rgba(130, 255, 127, .04)
        }
        /* book card hover */
        
        .book-card {
            transition: transform .2s ease, border-color .2s ease
        }
        
        .book-card:hover {
            transform: translateY(-4px);
            border-color: rgba(130, 255, 127, .25)
        }

        .lang-badge {
            transition: border-color .2s, background .2s
        }
        .lang-badge:hover {
            border-color: rgba(130,255,127,.3);

        }

        @media(max-width:900px) {
            .feature-row {

            }

            }
        }
