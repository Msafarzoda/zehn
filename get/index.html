  <script>
    (function() {
      var ua = navigator.userAgent || navigator.vendor || '';
      var APP_STORE = 'https://apps.apple.com/app/id6759160035';
      var GOOGLE_PLAY = 'https://play.google.com/store/apps/details?id=com.audiobook.zehn&hl=en';

      var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
      // iPadOS 13+ reports as Mac — catch touch-enabled Macs too
      var isIPadOS = /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
      var isAndroid = /Android/.test(ua);

      if (isIOS || isIPadOS) {
        window.location.replace(APP_STORE);
      } else if (isAndroid) {
        window.location.replace(GOOGLE_PLAY);
      }
      // else: desktop / unknown — fall through to the page below

    body {

    .grid-decor {

    .logo-mark {

      margin: 0 auto 24px;

    }
    .eyebrow {
      display: inline-block;
      font-size: 11px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--green);
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 14px;
    }
    h1 {

      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }
    p.sub {
      font-size: 15px;
      color: var(--text-dim);
      line-height: 1.6;
      max-width: 320px;
      margin: 0 auto 32px;
    }
    .stores {

      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    .store-btn {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 14px 26px;
      border-radius: 16px;
      background: #0a0a0a;
      border: 1px solid var(--line-2);
      text-decoration: none;
      width: 100%;
      max-width: 260px;
      transition: border-color .2s, background .2s, transform .15s;
    }
    .store-btn:hover {
      border-color: rgba(255,255,255,.32);
      background: #111;
      transform: translateY(-2px);
    }
    .store-btn svg { color: #fff; flex-shrink: 0; }
    .store-btn .txt { text-align: left; display: flex; flex-direction: column; }
    .store-btn .txt .top {
      font-size: 11px;
      color: rgba(255,255,255,.5);
      line-height: 1;
      margin-bottom: 3px;
      display: block;
    }
    .store-btn .txt .bottom {
      font-size: 17px;
      font-weight: 700;
      line-height: 1;
      color: #fff;
      display: block;
    }
    .qr {

      align-items: center;
      gap: 10px;
    }
    .qr img {
      border-radius: 10px;

    }
    .qr span {
      font-size: 11px;
      color: var(--text-mute);
      letter-spacing: .08em;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;

  </style>
</head>
