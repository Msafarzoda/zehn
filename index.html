<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Zehn — Learn a book in 15 minutes</title>
  <meta name="description" content="Zehn turns the world's best books into bite-sized 15-minute audio books. Available in English, Arabic, Russian, and Tajik." />

  <!-- hreflang for SEO — tells Google about all language versions -->
  <link rel="alternate" hreflang="en" href="https://thezehnapp.com/en/" />
  <link rel="alternate" hreflang="ar" href="https://thezehnapp.com/ar/" />
  <link rel="alternate" hreflang="ru" href="https://thezehnapp.com/ru/" />
  <link rel="alternate" hreflang="tg" href="https://thezehnapp.com/tj/" />
  <link rel="alternate" hreflang="x-default" href="https://thezehnapp.com/en/" />

  <link rel="canonical" href="https://thezehnapp.com/en/" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />

  <script>
    (function() {
      var lang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
      if (lang.startsWith('ar')) {
        window.location.replace('/ar/');
      } else if (lang.startsWith('ru')) {
        window.location.replace('/ru/');
      } else if (lang.startsWith('tg') || lang.startsWith('tj')) {
        window.location.replace('/tj/');
      } else {
        window.location.replace('/en/');
      }
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0;url=/en/" /></noscript>
</head>
<body style="background:#03212E;color:#EAF3F8;font-family:system-ui,sans-serif;margin:0">

    <p>Zehn turns the world's best books into bite-sized 15-minute audio summaries with live subtitles and Ask AI. 8,000+ books available in English, Arabic, Russian, and Tajik.</p>

      <a href="/en/">English</a> ·
      <a href="/ar/">العربية</a> ·
      <a href="/ru/">Русский</a> ·
      <a href="/tj/">Тоҷикӣ</a>
    </nav>
  </main>
</body>
</html>
